[project]
name = "rulesmith"
version = "0.1.0"
description = "Search for rule programs that ask a small judge for typed decisions, with DSPy and GEPA."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
keywords = ["dspy", "gepa", "llm", "decision graphs", "rules", "program search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "chess>=1.11,<2",
    "dspy==3.3.1",
    "gepa==0.1.4",
    "imageio-ffmpeg>=0.6,<1",
    "pillow>=11,<13",
    "pydantic>=2.11,<3",
    "typesafe-sdk>=0.6,<0.7",
    "vizdoom>=1.3,<2",
]

[project.scripts]
rulesmith = "rulesmith.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: paid calls to configured Jev and reflection models",
    "ruling: real inference against an explicitly configured Ruling server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.sdist]
# The docs' game videos run to tens of megabytes and are for reading on GitHub, not installing.
exclude = ["docs/assets"]
