<svg xmlns="http://www.w3.org/2000/svg" width="820" height="336" viewBox="0 0 820 336" font-family="system-ui, sans-serif" font-size="12">
<style>
.bg { fill: #fcfcfb } .ink { fill: #0b0b0b } .muted { fill: #52514e }
.grid { stroke: #e4e3df } .axis { stroke: #b5b4ae }
