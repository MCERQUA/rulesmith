<rect x="640" y="150" width="110.0" height="18" rx="2" class="them"/>
<text x="756.0" y="163" class="ink">1.00</text>
<text x="16" y="204" class="ink" font-size="14" font-weight="600">Clothing reviews: recommend or not?</text><text x="430" y="204" class="muted">tie · p = 0.66 · 6% of the calls</text>
<text x="190" y="233" text-anchor="end" class="ink" font-weight="600">rulesmith</text>
<rect x="200" y="220" width="332.8" height="18" rx="2" class="us"/>
<text x="538.8" y="233" class="ink" font-weight="600">0.924</text>
<rect x="640" y="220" width="6.7" height="18" rx="2" class="us"/>
