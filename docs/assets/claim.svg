<text x="16" y="300" class="muted">Means of 3 seeds, 300 held-out rows each; p from exact McNemar tests over the pooled rows. Bars start at zero.</text>
<text x="16" y="318" class="muted">On one-sentence inputs (TREC, Banking77) rulesmith ties DSPy; on job postings a TF-IDF classifier scores higher still.</text>
