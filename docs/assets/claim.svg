<rect width="820" height="336" class="bg"/>
<text x="16" y="24" font-size="14" font-weight="600" class="ink">Same 4B judge, same 100 examples, a fraction of the calls</text>
<text x="16" y="42" class="muted">rulesmith against DSPy's typed classifier (GEPA + ReAnchor), the judge fine-tuned on each seed's examples.</text>
<text x="200" y="74" class="muted" font-weight="600">accuracy</text>
<text x="640" y="74" class="muted" font-weight="600">model calls per row</text>
<text x="16" y="108" class="ink" font-size="14" font-weight="600">Job postings: scam or genuine?</text><text x="430" y="108" class="muted">+6.7 points · p = 3×10⁻⁶ · 29% of the calls</text>
<text x="190" y="137" text-anchor="end" class="ink" font-weight="600">rulesmith</text>
<rect x="200" y="124" width="281.6" height="18" rx="2" class="us"/>
<text x="487.6" y="137" class="ink" font-weight="600">0.782</text>
<rect x="640" y="124" width="32.4" height="18" rx="2" class="us"/>
<text x="678.4" y="137" class="ink" font-weight="600">0.29</text>
