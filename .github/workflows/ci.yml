name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
      # The dev group installs every extra, so the game and benchmark tests run too. No apt
      # packages: the ViZDoom wheel bundles SDL2 and Boost, and the suite plays it windowless
      # with audio off, so neither a display nor OpenAL is needed.
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
